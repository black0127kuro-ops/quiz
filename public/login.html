<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ログイン — 早押しクイズ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #fffaf0, #ffe9b5);
      color: #1f2a44;
      padding: 16px;
    }
    .box {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border: 1px solid #e6c987;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(255, 138, 31, 0.12);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 20px; font-size: 13px; color: #6e7891; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #6e7891; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e6c987;
      font-size: 16px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #ff8a1f;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .err { color: #e4474a; font-size: 13px; min-height: 1.2em; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>早押しクイズ</h1>
    <p>このサイトはパスワードで保護されています。</p>
    <form id="form">
      <label for="password">パスワード</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required autofocus />
      <button type="submit" id="btn">ログイン</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';
    const errEl = document.getElementById('err');
    const btn = document.getElementById('btn');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          errEl.textContent = 'パスワードが違います';
          btn.disabled = false;
          return;
        }
        let dest = next;
        if (!dest.startsWith('/') || dest.startsWith('//')) dest = '/';
        location.href = dest;
      } catch {
        errEl.textContent = '通信エラーです。もう一度お試しください。';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
